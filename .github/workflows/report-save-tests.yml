name: Report Save Regression Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/employee
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/employee/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_DB: report_tests
          POSTGRES_USER: report_tests
          POSTGRES_PASSWORD: report-tests-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U report_tests -d report_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REPORT_TEST_POSTGRES: '1'
    defaults:
      run:
        working-directory: backend/employee
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: backend/employee/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run --settings=core.test_settings
      - run: python manage.py test report --settings=core.test_settings
